<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片压缩工具</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="container">
        <!-- 头部区域test -->
        <header>
            <h1>图片压缩工具</h1>
            <p>简单、高效地压缩您的图片，减小文件大小</p>
        </header>

        <!-- 主要内容区域 -->
        <main>
            <!-- 上传区域 -->
            <section class="upload-section" id="uploadSection">
                <div class="upload-container" id="dropZone">
                    <img src="img/upload-icon.svg" alt="上传图标" id="uploadIcon">
                    <p>将图片拖放到这里或</p>
                    <label for="fileInput" class="upload-btn">选择图片</label>
                    <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg" hidden>
                    <p class="file-types">支持 PNG、JPG 格式</p>
                </div>
            </section>

            <!-- 图片处理区域 (初始隐藏) -->
            <section class="image-processing" id="imageProcessing" style="display: none;">
                <!-- 压缩设置区域 -->
                <div class="compression-settings">
                    <div class="quality-slider">
                        <label for="qualitySlider">压缩质量: <span id="qualityValue">80</span>%</label>
                        <input type="range" id="qualitySlider" min="1" max="100" value="80">
                    </div>
                    <button id="compressBtn" class="action-btn">压缩图片</button>
                </div>
                
                <!-- 预览区域 -->
                <div class="preview-container">
                    <div class="preview-box">
                        <h3>原始图片</h3>
                        <div class="image-container">
                            <img id="originalImage" alt="原始图片预览">
                        </div>
                        <div class="image-info">
                            <p>文件名: <span id="originalFilename"></span></p>
                            <p>文件大小: <span id="originalSize"></span></p>
                            <p>尺寸: <span id="originalDimensions"></span></p>
                        </div>
                    </div>
                    
                    <div class="preview-box">
                        <h3>压缩后图片</h3>
                        <div class="image-container">
                            <img id="compressedImage" alt="压缩后图片预览">
                        </div>
                        <div class="image-info">
                            <p>文件大小: <span id="compressedSize">等待压缩...</span></p>
                            <p>尺寸: <span id="compressedDimensions">等待压缩...</span></p>
                            <p>压缩率: <span id="compressionRate">等待压缩...</span></p>
                        </div>
                    </div>
                </div>
                
                <!-- 操作区域 -->
                <div class="actions">
                    <button id="downloadBtn" class="action-btn primary-btn" disabled>下载压缩图片</button>
                    <button id="resetBtn" class="action-btn secondary-btn">重新上传</button>
                </div>
            </section>
        </main>

        <!-- 底部区域 -->
        <footer>
            <p>© <span id="currentYear"></span> 图片压缩工具 | 使用HTML5技术 | 无需上传至服务器</p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
